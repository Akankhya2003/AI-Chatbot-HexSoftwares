<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h2>🤖 Smart AI Chatbot</h2>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        // Function to add messages
        function addMessage(sender, text) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add(sender);
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Function to show typing animation
        function showTyping() {
            const typingDiv = document.createElement("div");
            typingDiv.classList.add("bot", "typing");
            typingDiv.innerHTML = "<span></span><span></span><span></span>";
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return typingDiv;
        }

        sendBtn.addEventListener("click", () => {
            const msg = userInput.value.trim();
            if (msg === "") return;
            addMessage("user", "You: " + msg);
            userInput.value = "";

            // Show typing dots
            const typingDiv = showTyping();

            fetch("/get", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "msg=" + encodeURIComponent(msg)
            })
            .then(response => response.json())
            .then(data => {
                // Remove typing animation
                typingDiv.remove();
                // Add bot reply after slight delay
                setTimeout(() => {
                    addMessage("bot", "🤖 Bot: " + data.response);
                }, 300);
            });
        });

        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendBtn.click();
        });
    </script>
</body>
</html>
